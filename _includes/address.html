<section id="{{ section.section_id }}" class="page-section {{ section.background_style | default: 'bg-light' }}">
  <div class="container px-4 px-lg-5">
    <div class="row gx-4 gx-lg-5 justify-content-center">
      <div class="col-lg-8 col-xl-6 text-center">
        <h2 class="mt-0 section-title-premium text-dark">{{ section.title }}</h2>
        <div class="divider-premium"></div>
        {% if section.text %}<p class="text-muted mb-5">{{ section.text }}</p>{% endif %}
      </div>
    </div>
    <div class="row gx-4 gx-lg-5 align-items-center">
      <div class="col-lg-7 mb-4 mb-lg-0">
        <div class="looker-container" style="background: #fff;">
          <iframe src="{{ section.map }}" width="100%" height="400" frameborder="0"
            style="border:0; border-radius: 20px;" allowfullscreen></iframe>
        </div>
      </div>
      <div class="col-lg-5 ps-lg-5">
        <div class="d-flex mb-4">
          <div class="flex-shrink-0">
            <i class="bi bi-geo-alt-fill fs-2 text-primary"></i>
          </div>
          <div class="ms-3">
            <h4 class="fw-bold">{{ section.address.title }}</h4>
            <p class="text-muted mb-0">{{ section.address.text }}</p>
          </div>
        </div>
        <div class="d-flex">
          <div class="flex-shrink-0">
            <i class="bi bi-person-lines-fill fs-2 text-primary"></i>
          </div>
          <div class="ms-3">
            <h4 class="fw-bold">{{ section.phone.title }}</h4>
            <p class="text-muted mb-0">{{ section.phone.text }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
