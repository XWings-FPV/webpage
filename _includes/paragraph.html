<section id="{{ section.section_id }}"
  class="page-section {{ section.background_style | default: 'bg-light' }} {{ section.extra_class }}">
  <div class="container px-4 px-lg-5">
    {% if section.title %}
    <h2 class="text-center mt-0 {% if section.premium_title %}section-title-premium{% endif %}">{{ section.title }}</h2>
    {% if section.premium_title %}
    <div class="divider-premium"></div>
    {% else %}
    <hr class="divider border border-primary border-2">
    {% endif %}
    {% endif %}

    <div class="row justify-content-center">
      <div class="col-lg-10 {{ section.text_style | default: 'text-muted' }}">
        <div class="{% if section.glass %}glass-panel{% endif %}">
          {{ section.text | markdownify }}
        </div>
      </div>
    </div>
    {% include actions.html actions=section.actions %}
  </div>
</section>
