<section id="{{ section.section_id }}" class="page-section {{ section.background_style }}">
    <div class="container px-4 px-lg-5">
        <h2 class="text-center mt-0">{{ section.title }}</h2>
        <hr class="divider border border-primary border-2">
        <div class="row justify-content-center">
            <div class="col-lg-10 text-center">
                {% if section.text %}
                <div class="mb-4 text-muted lead">
                    {{ section.text | markdownify }}
                </div>
                {% endif %}

                <div
                    style="position: relative; width: 100%; max-width: 1000px; margin: 0 auto; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15);">
                    <div style="position: relative; padding-top: 75%; /* 4:3 aspect ratio */">
                        {% assign looker_url = section.url %}
                        {% unless looker_url contains '/embed/' %}
                        {% assign looker_url = looker_url | replace: '/reporting/', '/embed/reporting/' %}
                        {% endunless %}
                        <iframe src="{{ looker_url }}" frameborder="0"
                            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;"
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
